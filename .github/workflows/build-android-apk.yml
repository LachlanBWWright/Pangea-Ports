name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APK artifacts as a GitHub release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Release tag to create/update when publishing manually
        required: false
        default: ''
        type: string
      release_name:
        description: Release name for manual publishing
        required: false
        default: Pangea Ports Android build
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      android_apk: ${{ steps.android_apk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: android_apk
        run: echo "matrix=$(python3 scripts/ports.py matrix android-apk)" >> "$GITHUB_OUTPUT"

  build-android-apk:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.android_apk != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.android_apk) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APKs
        run: |
          cd "${{ matrix.path }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease
      - name: Collect APK artifacts
        run: |
          mkdir -p "${{ matrix.path }}/android/apk-artifacts"
          find "${{ matrix.path }}/android/app/build" -name "*.apk" -exec cp {} "${{ matrix.path }}/android/apk-artifacts/" \;
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-apk
          path: ${{ matrix.path }}/android/apk-artifacts
          compression-level: 0

  lua-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize only the smoke game's native dependency
        run: git submodule update --init --recursive games/Bugdom2-Android/extern/Pomme
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install smoke build toolchain
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build opt-in debug fixture APK
        working-directory: games/Bugdom2-Android/android
        run: |
          chmod +x gradlew
          ./gradlew -PluaSmoke=true assembleDebug
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify APK Lua hooks, level transition and restart persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android_lua_smoke.py --apk games/Bugdom2-Android/android/app/build/outputs/apk/debug/app-debug.apk --clear-data --timeout 240 --artifacts work/android-lua-smoke-results
      - name: Upload emulator Lua evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lua-emulator-smoke
          path: work/android-lua-smoke-results

  publish-apk-release:
    needs: build-android-apk
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          path: release-artifacts
      - name: Choose release metadata
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=Pangea Ports ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.release_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release tag
        run: test -n "${{ steps.release_meta.outputs.tag }}"
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: |
            Automated Android APK build from `${{ github.sha }}`.

            Included artifacts:
            - Android APKs (debug and release) for all 8 Pangea ports games
          files: |
            release-artifacts/**/*.apk
